<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${problem.title} + ' | FluxCode'">Problem Details</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/problems.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('Problems')}"></div>
<main class="problems-shell detail-layout" role="main">
    <a class="back-link" th:href="@{/problems}">&larr; All problems</a>
    <p class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <article class="problem-statement panel">
        <div class="problem-card-top"><span class="difficulty-badge" th:classappend="${' difficulty-' + #strings.toLowerCase(problem.difficulty)}" th:text="${problem.difficulty}">Medium</span><span class="source-badge" th:text="${problem.source ?: 'Local'}">Exercism</span></div>
        <h1 th:text="${problem.title}">Problem title</h1>
        <section><h2>Description</h2><p class="formatted-text" th:text="${problem.description}">Problem description</p></section>
        <section><h2>Input Format</h2><p class="formatted-text" th:text="${problem.inputFormat ?: 'See the description for input details.'}">Input format</p></section>
        <section><h2>Output Format</h2><p class="formatted-text" th:text="${problem.outputFormat ?: 'Print the required result.'}">Output format</p></section>
        <section><h2>Examples</h2><div class="examples"><pre th:text="${problem.sampleInput ?: 'No sample input provided.'}">Sample input</pre><pre th:text="${problem.sampleOutput ?: 'No sample output provided.'}">Sample output</pre></div></section>
        <section th:if="${problem.license}"><h2>Constraints</h2><p class="formatted-text" th:text="${problem.license}">Constraints</p></section>
        <a class="primary-btn" th:href="@{/problems/{id}/solve(id=${problem.id})}">Open code editor</a>
    </article>
</main>
</body>
</html>
