<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Contests | FluxCode</title>
	<link rel="stylesheet" th:href="@{/css/dashboard.css}">
	<link rel="stylesheet" th:href="@{/css/problems.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('Contests')}"></div>
<main class="problems-shell">
	<p class="eyebrow">Timed practice</p>
	<h1>Contests</h1>
	<section class="empty-state panel" th:if="${contests.isEmpty()}">
		<h2>No contests scheduled</h2>
		<p>Upcoming contests will appear here when they are published.</p>
	</section>
</main>
</body>
</html>
