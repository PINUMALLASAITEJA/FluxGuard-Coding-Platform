<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <p><a th:href="@{/problems}">Back to problems</a></p>
    <h1 th:text="${problem.id == null ? 'Create Problem' : 'Edit Problem'}">Create Problem</h1>
    <p th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></p>
    <form th:action="${problem.id == null ? '/problems' : '/problems/update/' + problem.id}" th:object="${problem}" method="post">
        <label for="title">Title</label>
        <input id="title" type="text" th:field="*{title}" required>
        <label for="difficulty">Difficulty</label>
        <input id="difficulty" type="text" th:field="*{difficulty}" required>
        <label for="description">Description</label>
        <textarea id="description" th:field="*{description}" rows="6"></textarea>
        <label for="inputFormat">Input Format</label>
        <textarea id="inputFormat" th:field="*{inputFormat}" rows="4"></textarea>
        <label for="outputFormat">Output Format</label>
        <textarea id="outputFormat" th:field="*{outputFormat}" rows="4"></textarea>
        <label for="sampleInput">Sample Input</label>
        <textarea id="sampleInput" th:field="*{sampleInput}" rows="3"></textarea>
        <label for="sampleOutput">Sample Output</label>
        <textarea id="sampleOutput" th:field="*{sampleOutput}" rows="3"></textarea>
        <button type="submit">Save Problem</button>
    </form>
</main>
</body>
</html>
