<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Problems | FluxCode</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/problems.css}">
    <link rel="stylesheet" th:href="@{/css/platform.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('Problems')}"></div>
<main class="problems-shell" role="main">
    <section class="problems-heading">
        <div>
            <p class="eyebrow">Practice library</p>
            <h1>Choose your next challenge</h1>
            <p class="subtitle">Build momentum with focused problems from Exercism and beyond.</p>
        </div>
        <div class="heading-actions">
            <a class="secondary-btn" th:href="@{/problems/new}">Create Problem</a>
            <form th:action="@{/problems/import-exercism}" method="post"><button class="primary-btn" type="submit">Import Exercism</button></form>
        </div>
    </section>
    <p class="notice" th:if="${importMessage}" th:text="${importMessage}"></p>
    <section class="problem-toolbar" aria-label="Problem filters">
        <label class="search-field" for="problem-search"><span>Search problems</span><input id="problem-search" type="search" placeholder="Search by title or source" autocomplete="off"></label>
        <span class="problem-count" th:text="${problems.size() + ' problems'}">0 problems</span>
    </section>
    <section class="problem-grid" th:if="${!problems.isEmpty()}" aria-label="Problems">
        <article class="problem-card" th:each="problem : ${problems}"
                 th:attr="data-search=${problem.title + ' ' + (problem.source ?: '') + ' ' + (problem.sourceId ?: '')}, data-problem-id=${problem.id}"
                 tabindex="0" role="button" th:aria-label="'Open problem details for ' + ${problem.title}">
            <div class="problem-card-main">
                <h2 th:text="${problem.title != null && !#strings.equalsIgnoreCase(problem.title, 'Description') && !#strings.equalsIgnoreCase(problem.title, 'Instructions') ? problem.title : (problem.sourceId != null ? problem.sourceId.replace('-', ' ') : 'Untitled problem')}">Problem title</h2>
                <div class="problem-card-meta" aria-label="Problem metadata">
                    <span class="difficulty-badge" th:classappend="${' difficulty-' + #strings.toLowerCase(problem.difficulty)}" th:text="${problem.difficulty}">Easy</span>
                    <span class="source-badge" th:text="${problem.source ?: 'Local'}">Exercism</span>
                    <span class="meta-tag" th:if="${problem.sourceId != null && !#strings.equalsIgnoreCase(problem.sourceId, 'description') && !#strings.equalsIgnoreCase(problem.sourceId, 'instructions')}" th:text="${problem.sourceId.replace('-', ' ')}">exercise</span>
                </div>
                <p class="problem-summary" th:text="${problem.description != null ? #strings.abbreviate(#strings.replace(problem.description, '\n', ' '), 110) : 'Practice challenge'}">Practice challenge</p>
            </div>
            <a class="primary-btn solve-btn" th:href="@{/problems/{id}/solve(id=${problem.id})}">Solve <span aria-hidden="true">→</span></a>
            <div class="admin-actions">
                <a th:href="@{/problems/edit/{id}(id=${problem.id})}">Edit</a>
                <form th:action="@{/problems/delete/{id}(id=${problem.id})}" method="post"><button type="submit">Delete</button></form>
            </div>
        </article>
    </section>
    <section class="empty-state panel" th:if="${problems.isEmpty()}"><h2>No problems yet</h2><p>Import the Exercism library to start practicing.</p></section>
</main>
<script>
    const search = document.getElementById('problem-search');
    const problemCards = document.querySelectorAll('.problem-card');

    search?.addEventListener('input', () => {
        const query = search.value.trim().toLowerCase();
        problemCards.forEach(card => {
            const haystack = (card.dataset.search || '').toLowerCase();
            card.hidden = query.length > 0 && !haystack.includes(query);
        });
    });

    problemCards.forEach(card => {
        const openProblem = (event) => {
            if (event.target.closest('a, button, form')) {
                return;
            }
            window.location.href = '/problems/' + card.dataset.problemId + '/solve';
        };

        card.addEventListener('click', openProblem);
        card.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                openProblem(event);
            }
        });
    });
</script>
</body>
</html>
