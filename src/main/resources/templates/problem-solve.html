<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${problem.title} + ' | Solve'">Solve Problem</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/problems.css}"><link rel="stylesheet" th:href="@{/css/solve.css}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar('Problems')}"></div>
<main class="solve-shell"><div class="solve-header"><a class="back-link" th:href="@{/problems/{id}(id=${problem.id})}">&larr; Problem statement</a><h1 th:text="${problem.title}">Problem</h1></div><div class="solve-layout"><article class="statement-pane panel"><span class="eyebrow">Problem statement</span><h2 th:text="${problem.title}">Problem</h2><h3>Description</h3><p class="formatted-text" th:text="${problem.description}">Description</p><h3>Input</h3><p class="formatted-text" th:text="${problem.inputFormat}">Input</p><h3>Output</h3><p class="formatted-text" th:text="${problem.outputFormat}">Output</p></article><section class="editor-pane"><form th:action="@{/problems/{id}/solve(id=${problem.id})}" method="post"><div class="editor-toolbar"><label for="language">Language</label><select id="language" name="language"><option th:selected="${selectedLanguage == 'Java'}">Java</option><option th:selected="${selectedLanguage == 'Python'}">Python</option><option th:selected="${selectedLanguage == 'C++'}">C++</option><option th:selected="${selectedLanguage == 'JavaScript'}">JavaScript</option></select></div><textarea class="code-editor" name="code" spellcheck="false" placeholder="Write your solution here..." th:text="${sourceCode}"></textarea><label class="stdin-label" for="stdin">Standard input</label><textarea class="stdin-editor" id="stdin" name="stdin" th:text="${stdin}"></textarea><div class="editor-actions"><button class="secondary-btn" type="reset">Reset Code</button><button class="primary-btn" type="submit">Run Code</button><button class="primary-btn submit-btn" type="submit">Submit Solution</button></div></form><section class="console panel"><div class="panel-header"><h2>Console</h2><span th:if="${message}" th:text="${message}">Execution output</span></div><p class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"></p><pre th:if="${result != null}" th:text="${result.stdout ?: result.stderr ?: result.compileOutput ?: 'No output.'}">No output yet.</pre><div class="result-grid" th:if="${result != null}"><span>Verdict <strong th:text="${result.status}">PENDING</strong></span><span>Time <strong th:text="${result.executionTimeMs != null ? result.executionTimeMs + ' ms' : '-'}">-</strong></span><span>Memory <strong th:text="${result.memoryKb != null ? result.memoryKb + ' KB' : '-'}">-</strong></span></div></section></section></div></main>
</body></html>
